name: Feature request
description: Propose a new feature or module for church-erp
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Which module does this belong to?
      options:
        - membership
        - giving
        - accounting
        - events
        - groups
        - volunteers
        - communications
        - reporting
        - automation
        - platform / tenant provisioning
        - other / cross-cutting
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
