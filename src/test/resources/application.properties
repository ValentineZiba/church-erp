spring.application.name=church-erp
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Context-load / slice tests run against in-memory H2, not the MySQL dev
# stack (Docker isn't assumed to be available for `mvn test`). Flyway is
# disabled here since the control-plane migrations are MySQL-flavored;
# Hibernate creates the schema instead, just for the test lifecycle.
spring.datasource.url=jdbc:h2:mem:churchos_control_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

churchos.security.jwt.secret=test-only-secret-not-used-in-production-00000000
churchos.security.jwt.expiration-minutes=720
churchos.security.cors.allowed-origins=http://localhost:3000

churchos.platform.seed-admin.email=admin@churchos.local
churchos.platform.seed-admin.password=test-password-only

churchos.tenant.base-domain=churchos.test
