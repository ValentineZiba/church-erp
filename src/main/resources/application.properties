spring.application.name=church-erp

# We authenticate platform admins manually (repository lookup + BCrypt) rather
# than via Spring Security's UserDetailsService, so exclude the auto-config
# that would otherwise stand up an unused default in-memory user/password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Control-plane datasource only, explicitly wired as @Primary in TenantDataSourceConfig (see
# tenant/config). Tenant databases are never configured here — each is resolved per-request by
# TenantRoutingDataSource from the `tenants` registry table in this same control-plane DB.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:churchos_control}
spring.datasource.username=${DB_USER:churchos}
spring.datasource.password=${DB_PASSWORD:churchos}

# Base domain tenant subdomains are matched against, e.g. gracechapel.<base-domain>. Requests with
# no matching subdomain (including all of local dev against localhost) must instead pass the
# resolved tenant slug via the X-Tenant-ID header.
churchos.tenant.base-domain=${TENANT_BASE_DOMAIN:churchos.app}

# Off by default: flip to true (or set TENANT_MIGRATE_ON_STARTUP=true) to have
# TenantMigrationRunner sweep every ACTIVE tenant database on boot, before this instance starts
# serving traffic. Leave false for local dev / CI test runs; a real deploy can instead trigger the
# runner from a dedicated CI step (see docs/ROADMAP.md §3.5, §9.4).
churchos.tenant.migrate-on-startup=${TENANT_MIGRATE_ON_STARTUP:false}

# Control-plane migrations only. Tenant migrations live under a separate
# classpath location and are applied per-tenant by TenantMigrationRunner, not
# by this auto-configured Flyway bean.
spring.flyway.locations=classpath:db/migration/controlplane

churchos.security.jwt.secret=${JWT_SECRET:bBItfCf3khxzfST6tBPXYBsJRcgWImYAwde+88Yq5RCHB2Qb+qkw9J96gvZqw8yw}
churchos.security.jwt.expiration-minutes=720
churchos.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Dev-only bootstrap super-admin, seeded on first startup if platform_admins is
# empty. Rotate/remove before any non-local deployment.
churchos.platform.seed-admin.email=${SEED_ADMIN_EMAIL:superadmin@churchos.local}
churchos.platform.seed-admin.password=${SEED_ADMIN_PASSWORD:TGPyADN3WGeE8vQDAT}
